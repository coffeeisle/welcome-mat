# Available languages: english, spanish
messages-version: "1.3"
selected-language: "english"

# Message packs configuration
message-packs:
  # Available packs: default, friendly, professional, funny, rpg, skyward, copper
  default:
    name: "Default"
    animation: "fire_spiral"
    messages:
      join:
        - "&e%player% &ajust joined the server!"
      leave:
        - "&e%player% &chas left the server!"
    splash:
      title: "&6Welcome!"
      subtitle: "&eEnjoy your stay!"
  friendly:
    name: "Friendly"
    animation: "heart_bloom"
    messages:
      join:
        - "&d✨ &e%player% &ahas joined the party! &d✨"
        - "&aWelcome back, &e%player%&a! We missed you! &d❤"
        - "&aLook who's here! &e%player% &ahas arrived! &d✨"
        - "&d🌟 &aThe amazing &e%player% &ahas joined! &d🌟"
      leave:
        - "&e%player% &7had to go... &cSee you soon! &d💕"
        - "&7Until next time, &e%player%&7! &d👋"
        - "&7We'll miss you, &e%player%&7! Come back soon! &d💖"
        - "&e%player% &7went to take a break! &d✨"
    splash:
      title: "&dWelcome Back, %player%!"
      subtitle: "&eWe're so happy you're here!"
  professional:
    name: "Professional"
    animation: "data_stream"
    messages:
      join:
        - "&7[&a+&7] &e%player%"
        - "&8» &e%player% &7has connected"
        - "&7(&a+&7) &e%player% &7joined the game"
      leave:
        - "&7[&c-&7] &e%player%"
        - "&8« &e%player% &7has disconnected"
        - "&7(&c-&7) &e%player% &7left the game"
    splash:
      title: "&7Welcome, Operator"
      subtitle: "&fConnection established successfully"
  funny:
    name: "Funny"
    animation: "confetti_burst"
    messages:
      join:
        - "&a%player% &efell from the sky!"
        - "&eLook out! &a%player% &ejust crashed the party!"
        - "&a%player% &ejust rolled in like a boss!"
        - "&eWhoosh! &a%player% &eappeared out of nowhere!"
      leave:
        - "&e%player% &cvanished in a puff of smoke!"
        - "&e%player% &cwas eaten by a dragon... (just kidding!)"
        - "&e%player% &chad to go touch some grass"
        - "&e%player% &cran away from their responsibilities"
    splash:
      title: "&aTa-da!"
      subtitle: "&eCue the laugh track!"
  rpg:
    name: "RPG Fantasy"
    animation: "rune_circle"
    messages:
      join:
        - "&6⚔ &e%player% &6has entered the realm"
        - "&6🏰 &eA new adventurer, &6%player%&e, arrives"
        - "&6📜 &eThe legend of &6%player% &ebegins here"
        - "&6⚔ &eHark! &6%player% &ejoins the quest!"
      leave:
        - "&6📜 &e%player% &6retreats to rest at an inn"
        - "&6⚔ &e%player% &6ventures forth to new lands"
        - "&6🏰 &e%player% &6must attend to other quests"
        - "&6📜 &eThe tale of &6%player% &epauses here"
    splash:
      title: "&6Hero Emerges"
      subtitle: "&eMay your quest be glorious!"
  skyward:
    name: "Skyward"
    animation: "skyward_cascade"
    messages:
      join:
        - "&b☁ &f%player% rode in on a Happy Ghast escort!"
        - "&d🎈 &fLocator ping! &b%player% &fjust drifted through the clouds."
        - "&b✨ &fA ghastling giggle announces &b%player%&f's arrival."
        - "&d☁ &f%player% parachuted down from Chase the Skies!"
      leave:
        - "&f%player% hitched a ride on a cloud taxi."
        - "&d🎈 &f%player% floated away to calm the ghastlings."
        - "&b☁ &f%player% ascended beyond the Locator Bar."
        - "&f%player% waved goodbye from a Happy Ghast cockpit."
    splash:
      title: "&bSkybound Arrival"
      subtitle: "&fMind the Happy Ghast giggles!"
  copper:
    name: "Copper Age"
    animation: "copper_golem"
    messages:
      join:
        - "&6⚙ &e%player% marched in with a Copper Golem squad."
        - "&6🛡 &eCopper armor polished—make room for %player%!"
        - "&6📦 &e%player% just upgraded their storage with Copper Chests."
        - "&6🔶 &e%player% sparked the Copper Age on this server!"
      leave:
        - "&6⚙ &e%player% oxidized away for maintenance."
        - "&6🛠 &e%player% went to wax their Copper gear."
        - "&6📦 &e%player% is reorganizing Copper Chests back home."
        - "&6🔶 &e%player% retreated to calibrate the Copper Golems."
    splash:
      title: "&6Copper Sparks"
      subtitle: "&eShine bright, inventor!"

